name: Moodle Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_405_STABLE
            php: '8.3'
          - moodle-branch: MOODLE_503_STABLE
            php: '8.4'
    env:
      DB: mariadb
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, curl, gd, intl, soap, sodium, exif, openssl, zip, fileinfo, xsl
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
          php ci/bin/moodle-plugin-ci install --plugin ./plugin/cpdrecords --db-host=127.0.0.1

      - name: PHP lint
        run: php ci/bin/moodle-plugin-ciphplint

      - name: PHP Mess Detector
        continue-on-error: true
        run: php ci/bin/moodle-plugin-ciphpmd

      - name: Moodle coding style
        run: php ci/bin/moodle-plugin-ciphpcs --max-warnings 0

      - name: PHPDoc
        run: php ci/bin/moodle-plugin-ciphpdoc --max-warnings 0

      - name: Plugin validation
        run: php ci/bin/moodle-plugin-civalidate

      - name: Upgrade savepoints
        run: php ci/bin/moodle-plugin-cisavepoints

      - name: Mustache validation
        run: php ci/bin/moodle-plugin-cimustache

      - name: Front-end build checks
        run: php ci/bin/moodle-plugin-cigrunt --max-lint-warnings 0

      - name: PHPUnit
        run: php ci/bin/moodle-plugin-ciphpunit --fail-on-warning

      - name: Behat
        run: php ci/bin/moodle-plugin-cibehat --profile chrome --scss-deprecations

      - name: Upload Behat failure output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: behat-failure-${{ matrix.moodle-branch }}-php-${{ matrix.php }}
          path: plugin/**/*.html
          if-no-files-found: ignore
